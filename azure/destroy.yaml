# This is maintained by the ITCO Team
name: 'Destroy'

on:
    workflow_dispatch:
      inputs:
        environment:
          required: true
          default: 'Stop'
          description: 'Please confirm the action to take'
          type: choice
          options:
            - 'Stop'
            - 'Destroy'
  
jobs:
    destroy:
      name: 'Destroy'
      uses: <github_repo>/.github/workflows/terraform-destroy.yml@master
      with:
        terraform_version: ${{ vars.TERRAFORM_VERSION }}
        working_directory: ${{ vars.WORKING_DIRECTORY }}
        enable_destroy: ${{ vars.ENABLE_DESTROY }}
      secrets:
        azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client_secret_tf_vars: ${{ secrets.CLIENT_SECRET_TF_VARS }}
        azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
        backend_config_hcl: ${{ secrets.BACKEND_CONFIG_HCL }}
