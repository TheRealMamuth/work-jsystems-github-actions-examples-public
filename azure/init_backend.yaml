name: 'Init Backend'

on:
    workflow_dispatch:
  
jobs:
    backend_create:
      name: 'Backend Create'
      uses: <github_repo>/.github/workflows/terraform-create-backend.yml@master
      with:
        terraform_version: ${{ vars.TERRAFORM_VERSION }}
        working_directory: ${{ vars.WORKING_DIRECTORY }}
        create_backend: ${{ vars.CREATE_BACKEND }}
        backend_resource_group_name: a-piko-test-terraform-backend
        backend_storage_account_name: apiokbackend
        backend_container_name: tfstate
      secrets:
        azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
        azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
        azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client_secret_tf_vars: ${{ secrets.CLIENT_SECRET_TF_VARS }}
        azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
